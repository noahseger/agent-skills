name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-modeling/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: event-modeling/ts/package-lock.json
      - run: npm ci
      # tsc, biome, node --test, buf lint
      - run: npm test
      # The checked-in proto has to be what the model generates right now.
      - run: npm run proto -- examples/todo-app -o examples/proto
      - run: git diff --exit-code examples/proto
